services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "10000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:?Set GEOAPIFY_API_KEY in Dokploy}
      ConnectionStrings__DefaultConnection: 'Server=database,1433;Database=sportsbuddymatcher;User ID=sa;Password="${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in Dokploy}";Encrypt=True;TrustServerCertificate=True;'
    expose:
      - "10000"
    volumes:
      - uploaded-photos:/app/wwwroot/uploads
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks:
      - backend

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Review SQL Server terms and set ACCEPT_EULA=Y}
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in Dokploy}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in Dokploy}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/mssql-tools18/bin/sqlcmd -S database -U sa -C -b -Q "IF DB_ID(N'sportsbuddymatcher') IS NULL CREATE DATABASE [sportsbuddymatcher];"
        existing=$$(/opt/mssql-tools18/bin/sqlcmd -S database -U sa -C -b -d sportsbuddymatcher -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.tables WHERE is_ms_shipped = 0;")
        if [ "$${existing//[[:space:]]/}" = "0" ]; then
          /opt/mssql-tools18/bin/sqlcmd -S database -U sa -C -b -d sportsbuddymatcher -i /schema.sql
        else
          echo "Existing database detected; skipping initialization."
        fi
    volumes:
      - ./deploy/schema.sql:/schema.sql:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

volumes:
  sql-data:
  uploaded-photos:

networks:
  backend:
